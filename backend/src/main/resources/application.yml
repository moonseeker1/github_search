server:
  port: 9400

spring:
  application:
    name: github-search
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/github_search?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.githubsearch.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# GitHub API
github:
  api:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    connect-timeout: 30
    read-timeout: 60

# Model Service (BGE-M3 & Reranker)
model:
  embedding:
    url: http://127.0.0.1:8000
  reranker:
    url: http://127.0.0.1:8001

# LLM (Qwen)
llm:
  api-key: sk-8eda029bd3394d3ab1207ba1d79d3f01
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3-max

# Logging
logging:
  level:
    com.githubsearch: debug
    org.springframework.web: info
